<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Navigation Test</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      padding: 40px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
    }
    .test-box {
      margin-bottom: 50px;
      padding: 24px;
      border: 1px solid var(--border-medium);
      border-radius: 12px;
      background: var(--bg-surface);
    }
    h3 { margin-bottom: 16px; font-family: var(--font-display); }
  </style>
</head>
<body>
  <div class="test-box">
    <h3>Dark Mode Preview (Current Theme)</h3>
    <header class="site-header" style="position: relative; border-radius: 8px;">
      <div class="nav-container container">
        <a href="#hero" class="brand-link" aria-label="Ronille Alcala Portfolio Home">
          <div class="brand-logo-wrap" aria-hidden="true">
            <span class="brand-logo-mark"></span>
          </div>
          <div class="brand-text-group">
            <span class="brand-name">Ronille Alcala</span>
            <span class="brand-tagline">Nille Arts</span>
          </div>
        </a>
        <nav class="nav-menu">
          <a href="#hero" class="nav-link active">Home</a>
          <a href="#about" class="nav-link">About</a>
          <a href="#featured" class="nav-link">Featured</a>
          <a href="#works" class="nav-link">Works</a>
          <a href="#contact" class="nav-link">Contact</a>
        </nav>
      </div>
    </header>
  </div>

  <div class="test-box" data-theme="light" style="background: #faf8f5; color: #121316;">
    <h3>Light Mode Preview</h3>
    <header class="site-header" style="position: relative; border-radius: 8px; background: rgba(255,255,255,0.85); border-color: rgba(0,0,0,0.08);">
      <div class="nav-container container">
        <a href="#hero" class="brand-link" aria-label="Ronille Alcala Portfolio Home" style="color: #121316;">
          <div class="brand-logo-wrap" aria-hidden="true">
            <span class="brand-logo-mark" style="background-color: #121316;"></span>
          </div>
          <div class="brand-text-group">
            <span class="brand-name" style="color: #121316;">Ronille Alcala</span>
            <span class="brand-tagline" style="color: #868c98;">Nille Arts</span>
          </div>
        </a>
        <nav class="nav-menu">
          <a href="#hero" class="nav-link active" style="color: #121316;">Home</a>
          <a href="#about" class="nav-link" style="color: #585c67;">About</a>
          <a href="#featured" class="nav-link" style="color: #585c67;">Featured</a>
          <a href="#works" class="nav-link" style="color: #585c67;">Works</a>
          <a href="#contact" class="nav-link" style="color: #585c67;">Contact</a>
        </nav>
      </div>
    </header>
  </div>
</body>
</html>
